name: RFC Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "text/*.md"
      - "text/**/*.md"
      - "0000-template.md"

concurrency:
  group: rfc-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        if: github.event.action != 'closed'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build preview
        if: github.event.action != 'closed'
        run: |
          shopt -s nullglob
          files=(0000-template.md text/*.md)
          mkdir -p preview
          pandoc "${files[@]}" \
            --standalone \
            --toc \
            --metadata title="Qrisp RFC preview" \
            --css="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css" \
            -o preview/index.html

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./preview
          preview-branch: gh-pages
          umbrella-dir: pr-preview
