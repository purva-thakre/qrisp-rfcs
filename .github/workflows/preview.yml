name: RFC Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: rfc-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build preview
        if: github.event.action != 'closed'
        run: |
          python3 -m pip install --quiet markdown pymdown-extensions pygments
          python3 - <<'PY'
          from pathlib import Path
          import markdown
          from pygments.formatters import HtmlFormatter

          extensions = [
              "abbr",
              "attr_list",
              "def_list",
              "footnotes",
              "md_in_html",
              "tables",
              "sane_lists",
              "toc",
              "pymdownx.caret",
              "pymdownx.highlight",
              "pymdownx.magiclink",
              "pymdownx.mark",
              "pymdownx.smartsymbols",
              "pymdownx.superfences",
              "pymdownx.tasklist",
              "pymdownx.tilde",
          ]

          files = sorted(Path("text").glob("*.md"))
          body = "\n".join(
              markdown.markdown(
                  path.read_text(encoding="utf-8"),
                  extensions=extensions,
              )
              for path in files
          )

          style = """
          body{max-width:52rem;margin:2rem auto;padding:0 1rem;font:16px/1.6 system-ui,sans-serif}
          pre{background:#f6f8fa;padding:1rem;overflow:auto;border-radius:6px}
          code{background:#f6f8fa;padding:.15em .3em;border-radius:4px}
          pre code{background:none;padding:0}
          table{border-collapse:collapse}
          th,td{border:1px solid #d0d7de;padding:.4rem .7rem}
          img{max-width:100%}
          """

          style += "\n" + HtmlFormatter().get_style_defs(".highlight")

          preview = Path("preview")
          preview.mkdir(exist_ok=True)
          (preview / "index.html").write_text(
              "<!doctype html><meta charset=utf-8><title>Qrisp RFC preview</title>"
              f"<style>{style}</style>"
              + body,
              encoding="utf-8",
          )
          PY

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./preview
          preview-branch: gh-pages
          umbrella-dir: pr-preview
